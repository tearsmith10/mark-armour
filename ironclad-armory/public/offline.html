<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070908" />
    <title>You're offline · mark-armour</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #070908;
        background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245, 158, 11, 0.07), transparent);
        color: #d6d3d1;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        padding: 32px 24px;
        background: #0b0e0c;
        border: 1px solid #1b221e;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 20px;
        background: #f59e0b;
        color: #14110a;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.05em;
      }
      h1 {
        font-size: 22px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #f5f5f4;
      }
      .accent {
        color: #f59e0b;
      }
      p {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.6;
        color: #a8a29e;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 24px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
        cursor: pointer;
        border: 0;
        transition: opacity 0.15s ease;
      }
      button {
        background: #f59e0b;
        color: #14110a;
      }
      a {
        background: transparent;
        color: #d6d3d1;
        border: 1px solid #27302b;
      }
      button:hover,
      a:hover {
        opacity: 0.85;
      }
      .hint {
        margin-top: 18px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="logo" aria-hidden="true">MA</span>
      <h1>You're <span class="accent">offline</span></h1>
      <p>
        This page isn't cached and there's no connection right now. Your cart is safe —
        it syncs the moment you're back online.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/">Go home</a>
        <a href="/products">Browse catalog</a>
      </div>
      <p class="hint">mark-armour · mark-armour.vercel.app</p>
    </main>
  </body>
</html>
